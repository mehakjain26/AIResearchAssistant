[mutmut]
# Mutation testing of the backend: NO_PROXY='*' .venv/bin/mutmut run, then .venv/bin/mutmut results
# NO_PROXY is needed on macOS: without it, forked workers segfault reading the system proxy settings.
source_paths=app
pytest_add_cli_args_test_selection=tests/qa
pytest_add_cli_args=
    -m
    not e2e
    -p
    no:warnings
