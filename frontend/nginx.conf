server {
  listen 80;
  client_max_body_size 50m;          # PDF uploads

  gzip on;
  gzip_types text/css application/javascript application/json;

  location /assets/ {            # hashed file names, safe to cache
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_read_timeout 300s;         # summaries and PDF fetches can take a while
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;      # React Router routes
  }
}
